name: 构建跨平台安装包

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'  # 推送 v 开头的 tag 时自动触发

# Windows 控制台默认 cp1252，强制 Python 输出 UTF-8，避免中文日志崩溃
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  # ==================== Windows 安装包 ====================
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备图标（无 ico 时由 icns 转换）
        shell: bash
        run: |
          if [ ! -f horse.ico ]; then
            python -c "from PIL import Image; img=Image.open('horse.icns'); img.save('horse.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          fi
          ls -la horse.ico

      - name: PyInstaller 打包（onedir）
        shell: bash
        run: |
          set -e
          pyinstaller --noconfirm --windowed --name HelixAudioCleaner \
            --icon horse.ico \
            --collect-all mutagen \
            --collect-all cryptography \
            main.py
          echo "=== dist 目录 ==="
          ls -la dist/HelixAudioCleaner/ | head -20
          test -f dist/HelixAudioCleaner/HelixAudioCleaner.exe && echo "EXE 生成成功"

      - name: 逻辑测试
        shell: bash
        run: python test_logic.py

      - name: 提取版本号
        id: ver
        shell: bash
        run: |
          VER=$(grep -Eo '## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | tr -d '# v')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "当前版本: $VER"

      - name: Inno Setup 生成安装包
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion="${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败" }
          Get-ChildItem Output

      - name: 生成便携版 zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist/HelixAudioCleaner/*" `
            -DestinationPath "HELIX_Audio_Cleaner_portable_v$ver.zip"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: HELIX-Audio-Cleaner-Windows-Setup
          path: |
            Output/*.exe
            HELIX_Audio_Cleaner_portable_v*.zip
          retention-days: 90

  # ==================== Mac Intel (x86_64) ====================
  # macos-13（Intel 硬件 runner）已淘汰，改用 macos-15（arm64）+ Rosetta 2
  # 安装 x86_64 版 Python，PyInstaller 在 x86_64 解释器下即产出 Intel 包
  mac-intel:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 x86_64 Python（经 Rosetta 2）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 安装依赖（强制 Rosetta x86_64）
        run: |
          set -e
          PY="$pythonLocation/bin/python3.11"
          echo "使用解释器: $PY"
          file "$PY"
          # 显式以 x86_64 运行（universal2 二进制默认会按 arm64 启动）
          arch -x86_64 "$PY" -c "import platform,sys; print('架构:', platform.machine(), sys.executable)"
          test "$(arch -x86_64 "$PY" -c 'import platform; print(platform.machine())')" = "x86_64"
          arch -x86_64 "$PY" -m pip install --upgrade pip
          arch -x86_64 "$PY" -m pip install -r requirements.txt
          # 确认关键二进制扩展也是 x86_64
          arch -x86_64 "$PY" -c "import cryptography, PIL, tkinter; print('cryptography/PIL/tkinter 导入成功')"
          SP=$(arch -x86_64 "$PY" -c "import cryptography,os; print(os.path.dirname(cryptography.__file__))")
          lipo -archs "$SP"/hazmat/bindings/_rust.abi3*.so

      - name: 逻辑测试
        run: |
          arch -x86_64 "$pythonLocation/bin/python3.11" test_logic.py

      - name: PyInstaller 打包（x86_64）
        run: |
          set -e
          arch -x86_64 "$pythonLocation/bin/python3.11" -m PyInstaller \
            --noconfirm --windowed --name HelixAudioCleaner \
            --icon horse.icns \
            --collect-all mutagen \
            --collect-all cryptography \
            main.py
          # 改为中文 app 名，与本机交付版一致
          mv dist/HelixAudioCleaner.app "dist/HELIX音频清理工具.app"
          BIN="dist/HELIX音频清理工具.app/Contents/MacOS/HelixAudioCleaner"
          echo "=== 二进制架构 ==="
          file "$BIN"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q x86_64
          if lipo -archs "$BIN" | grep -q arm64; then echo "错误：包含 arm64"; exit 1; fi

      - name: ad-hoc 签名
        run: |
          set -e
          codesign --force --deep --sign - "dist/HELIX音频清理工具.app"
          codesign --verify --verbose "dist/HELIX音频清理工具.app"

      - name: 打包 zip
        run: |
          VER=$(grep -Eo '## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | tr -d '# v')
          ditto -c -k --keepParent "dist/HELIX音频清理工具.app" "HELIX_Audio_Cleaner_MacIntel_v$VER.zip"
          ls -la "HELIX_Audio_Cleaner_MacIntel_v$VER.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HELIX-Audio-Cleaner-MacIntel
          path: HELIX_Audio_Cleaner_MacIntel_v*.zip
          retention-days: 90
